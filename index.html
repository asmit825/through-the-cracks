<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Through the Cracks — WEVL 89.9 FM Playlist Archive & Analytics</title>
    <meta name="description" content="Explore 13+ years of radio playlist archives, artist stats, and song analytics for WEVL 89.9 FM's Through the Cracks program hosted by Ed Dirmeyer." />
    <meta name="theme-color" content="#F5F4F0" />
    <!-- Google Fonts — Playfair Display (headlines), Source Serif 4 (body), JetBrains Mono (labels/metadata) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Playfair+Display:wght@400;500;600;700;800;900&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
    <!--
      Google Material Symbols (Rounded) — the only sanctioned icon library.
      Subset to the exact glyphs this app uses (~6.5KB). wght=300 gives the thin 1.5px stroke.
      WARNING: adding an icon to the markup without adding its name here does NOT 404 —
      Google silently falls back to serving the entire 1.2MB font. Keep this list in sync.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300,0..1,0&icon_names=album,arrow_forward,bar_chart,chevron_left,chevron_right,close,dark_mode,database,graphic_eq,light_mode,mic,music_note,open_in_new,playlist_play,radio,search,trophy" rel="stylesheet">
  </head>
  <body>
    <!-- Prevent flash-of-wrong-theme by applying data-theme before React renders. -->
    <script>
      (function() {
        var t = localStorage.getItem('ttc-theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
